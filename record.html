<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f9e6f1"><link rel="icon" href="assets/star.svg"><script src="theme.js?v=20261121-11"></script><link rel="stylesheet" href="design.css?v=20261121-11"><link rel="stylesheet" href="navigation.css?v=20261121-11"><title>记录 · 曾❤敏</title><script src="memories.js?v=20261121-11" defer></script><script src="record.js?v=20261121-11" defer></script><script src="navigation.js?v=20261121-11" defer></script><script src="music.js?v=20261121-11" defer></script></head><body data-page="record"><main class="record-shell"><header class="record-top"><a id="back-records" class="back-link" href="dailyM.html">dailyM</a><div class="record-top-actions"><button id="edit-record" class="quiet-button" type="button" hidden>编辑</button><button id="delete-record" class="quiet-button" type="button" hidden>删除</button></div></header><article id="record-view" class="record-detail" hidden><div class="detail-meta" id="detail-meta"></div><h1 id="detail-title"></h1><p class="detail-game" id="detail-game" hidden></p><div class="detail-body" id="detail-body"></div><div class="detail-photos" id="detail-photos"></div></article><form id="record-form" class="record-editor" hidden><h1 id="editor-title">写下这一刻</h1><label>标题<input id="record-title" maxlength="80" required></label><label id="game-name-field" hidden>游戏名称<input id="record-game-name" maxlength="80"></label><div id="food-fields" hidden><div class="field-row"><label>分类<select id="record-food-type"><option value="meal">每日饮食</option><option value="favorite">喜欢吃的</option><option value="avoid">忌口</option></select></label><label>是谁的记录<select id="record-person"><option>我们</option><option>曾</option><option>敏</option></select></label></div><label>食物名称<input id="record-food-name" maxlength="80"></label><label id="meal-field">餐次<select id="record-meal"><option>早餐</option><option selected>午餐</option><option>晚餐</option><option>加餐</option></select></label></div><div class="field-row"><label>日期<input id="record-date" type="date" required></label><label id="mood-field">心情<select id="record-mood"><option>晴朗</option><option>开心</option><option>平静</option><option>想你</option><option>有点累</option></select></label><label id="duration-field" hidden>时长（分钟）<input id="record-duration" type="number" min="0" max="1440" step="1" value="60"></label></div><label>正文<textarea id="record-note" rows="10" maxlength="30000"></textarea></label><div class="photo-heading"><span>照片</span><label class="quiet-button photo-picker" for="record-files">＋ 添加图片</label><input id="record-files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div class="editor-photos" id="editor-photos"></div><p class="form-error" id="record-error" role="alert"></p><div class="editor-actions"><button class="primary-button" id="save-record" type="submit">保存</button><button class="quiet-button" id="cancel-edit" type="button">取消</button></div></form><section id="record-missing" class="empty-records" hidden><h1>还没有这条记录</h1></section></main><dialog class="photo-viewer" id="photo-viewer" aria-label="查看照片"><button class="viewer-close" id="viewer-close" type="button" aria-label="关闭照片">×</button><button class="viewer-prev" id="viewer-prev" type="button" aria-label="上一张照片">‹</button><img id="viewer-image" alt="记录中的照片"><button class="viewer-next" id="viewer-next" type="button" aria-label="下一张照片">›</button></dialog><div id="journal-toast" class="journal-toast" role="status" aria-live="polite"></div></body></html>
