<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07151e">
  <meta name="description" content="从 2025 年 12 月 9 日开始，和你一起，把每一个冬天慢慢点亮。属于我们的互动圣诞夜。">
  <title>敏，冬日暖阳</title>
  <link rel="icon" type="image/svg+xml" href="assets/star.svg">
  <link rel="stylesheet" href="style.css?v=20261122-14">
  <link rel="stylesheet" href="navigation.css?v=20261122-14"><link rel="stylesheet" href="design.css?v=20261122-16">

<link rel="stylesheet" href="sync.css?v=20261122-15"><link rel="stylesheet" href="actions.css?v=20261122-15"><script src="sync-model.js?v=20261122-16" defer></script><script src="memories.js?v=20261122-14" defer></script><script src="media.js?v=20261122-14" defer></script><script src="gallery-data.js?v=20261122-15" defer></script><script src="sync-client.js?v=20261122-14" defer></script><script src="navigation.js?v=20261122-14" defer></script><script src="sync-ui.js?v=20261122-14" defer></script><script src="app.js?v=20261122-14" defer></script><script src="gallery.js?v=20261122-14" defer></script><script src="music.js?v=20261122-14" defer></script></head>
<body data-page="welcome">
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 2.8 6.6 7.2.7-5.5 4.7 1.6 7-6.1-3.7L5.9 21l1.6-7L2 9.3l7.2-.7Z"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M3.34 7l17.32 10M3.34 17 20.66 7M8 4l4 3 4-3M8 20l4-3 4 3M3 11l4-2-1-5M21 13l-4 2 1 5M6 20l1-5-4-2M18 4l-1 5 4 2"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 9l11-2"/><ellipse cx="5.5" cy="18.5" rx="3.5" ry="2.5"/><ellipse cx="16.5" cy="16.5" rx="3.5" ry="2.5"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 8a2.5 2.5 0 1 1 3.2 3.7c-.7.3-.7.8-.7 1.8M12 17h.01"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
  </defs></svg>

  <main class="night" id="night" aria-label="属于我们的互动圣诞夜">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <h1 class="winter-title" id="title" aria-label="敏，冬日暖阳"><span id="typed-title"></span></h1>
    <button class="skip icon-control" id="skip" type="button" aria-label="跳过开场" title="跳过开场"><svg><use href="#i-next"/></svg></button>

    <div class="scene-interactions" id="scene-interactions">
      <button class="tree-touch" id="tree-touch" type="button" aria-label="轻触圣诞树，点亮一片星光"></button>
      <button class="tree-star" id="tree-star" type="button" aria-label="点树顶星星，许一个愿"><span class="star-halo" aria-hidden="true"></span><svg><use href="#i-star"/></svg><span class="star-tip">许个愿吧</span></button>
      <button class="couple" id="couple" type="button" aria-label="轻触牵手的我们，看看相恋时光"><span class="couple-ground" aria-hidden="true"></span><img src="assets/couple.png" alt="从我们的牵手影子中诞生的情侣剪影" width="1024" height="1024"><span class="couple-heart" aria-hidden="true">♡</span></button>
      <button class="gift gift-memory" data-gift="memory" type="button" aria-label="拆开礼物：牵手的回忆"><span class="gift-bow" aria-hidden="true"></span><span class="gift-lid" aria-hidden="true"></span><span class="gift-box" aria-hidden="true"></span><span class="gift-label">一张回忆</span></button>
      <button class="gift gift-letter" data-gift="letter" type="button" aria-label="拆开礼物：给你的圣诞信"><span class="gift-bow" aria-hidden="true"></span><span class="gift-lid" aria-hidden="true"></span><span class="gift-box" aria-hidden="true"></span><span class="gift-label">一封小信</span></button>
      <button class="gift gift-together" data-gift="together" type="button" aria-label="拆开礼物：一起过冬的小约定"><span class="gift-bow" aria-hidden="true"></span><span class="gift-lid" aria-hidden="true"></span><span class="gift-box" aria-hidden="true"></span><span class="gift-label">一个约定</span></button>
    </div>

    <div class="love-clock" id="love-clock" aria-label="从2025年12月9日起的相恋时光"><div class="clock-digits"><strong id="days">—</strong><span>天</span></div><span class="clock-detail" id="clock-detail"></span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <a class="enter-button welcome-enter" hidden href="./?home=1">进入主页<span aria-hidden="true">♡</span></a></main>

  <dialog class="wish-dialog" id="wish-dialog" aria-labelledby="wish-title">
    <div class="paper"><button class="close-button" type="button" data-close aria-label="关闭许愿纸条"><svg><use href="#i-close"/></svg></button><span class="paper-star" aria-hidden="true">✦</span><h2 id="wish-title">有些心愿，<br>想和你一起实现。</h2>
    <form id="wish-form"><label class="sr-only" for="wish-text">我的心愿</label><textarea id="wish-text" maxlength="240" rows="4" placeholder="比如，想和你一起看今年的第一场雪……" required></textarea><div class="form-meta"><output id="char-count" for="wish-text">0 / 240</output></div><p class="form-error" id="wish-error" role="alert"></p><button class="paper-submit" type="submit"><svg><use href="#i-star"/></svg>让心愿飞向星星</button></form>
    <section class="saved-section" aria-labelledby="saved-title"><h3 id="saved-title">心愿 <span id="wish-count">0</span></h3><div id="wish-list" class="wish-list"></div></section></div>
  </dialog>

  <dialog class="gift-dialog" id="gift-dialog" aria-labelledby="gift-title"><div class="gift-paper"><button class="close-button" type="button" data-close aria-label="关闭礼物"><svg><use href="#i-close"/></svg></button><p class="paper-kicker" id="gift-kicker"></p><h2 id="gift-title"></h2><div id="gift-content"></div></div></dialog>
  <dialog class="gallery-dialog" id="gallery-dialog" aria-labelledby="gallery-title">
    <header class="gallery-header"><button class="gallery-back icon-control" id="gallery-back" type="button" aria-label="返回相册分类" title="返回分类" hidden><svg><use href="#i-next"/></svg></button><h2 id="gallery-title">照相馆</h2><button class="icon-control" id="gallery-close" type="button" aria-label="关闭照相馆" title="关闭照相馆"><svg><use href="#i-close"/></svg></button></header>
    <div class="gallery-categories" id="gallery-categories" aria-label="相册分类"></div>
    <section class="gallery-room" id="gallery-room" aria-label="环形回忆墙" hidden><div class="photo-orbit" id="photo-orbit"></div><div class="orbit-controls"><button class="icon-control prev-control" id="orbit-prev" type="button" aria-label="向前转动照片" title="向前转动"><svg><use href="#i-next"/></svg></button><button class="icon-control" id="orbit-pause" type="button" aria-label="暂停转动" aria-pressed="false" title="暂停转动"><svg><use href="#i-pause"/></svg></button><button class="icon-control" id="orbit-next" type="button" aria-label="向后转动照片" title="向后转动"><svg><use href="#i-next"/></svg></button></div></section>
  </dialog>
  <dialog class="lightbox-dialog" id="lightbox-dialog" aria-label="放大照片"><button class="icon-control lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览" title="关闭预览"><svg><use href="#i-close"/></svg></button><button class="icon-control lightbox-prev prev-control" id="lightbox-prev" type="button" aria-label="上一张照片" title="上一张"><svg><use href="#i-next"/></svg></button><figure><img id="lightbox-image" alt="" src="assets/gallery/love-01.jpg"><figcaption id="lightbox-caption"></figcaption></figure><button class="icon-control lightbox-next" id="lightbox-next" type="button" aria-label="下一张照片" title="下一张"><svg><use href="#i-next"/></svg></button></dialog>
  <noscript><div class="noscript">请开启浏览器的 JavaScript，来点亮这棵属于我们的圣诞树。</div></noscript>
</body>
</html>
